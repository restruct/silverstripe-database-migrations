name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: SS${{ matrix.silverstripe }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per supported Silverstripe major, at the oldest and newest PHP that major is
          # used with here. The module's composer.json is the source of truth for the supported
          # range (framework ^5 || ^6, php ^8.1); this matrix must follow it.
          - silverstripe: '5'
            php: '8.1'
            recipe: '^5'
            testing: '^3'
          - silverstripe: '5'
            php: '8.3'
            recipe: '^5'
            testing: '^3'
          - silverstripe: '6'
            php: '8.3'
            recipe: '^6'
            testing: '^4'
          - silverstripe: '6'
            php: '8.4'
            recipe: '^6'
            testing: '^4'

    services:
      database:
        # MariaDB rather than MySQL: it matches both the local dev machines and the Forge
        # servers, so a version-specific failure here means something real. The module's SQL
        # (RENAME TABLE, ALTER ... CHANGE, UPDATE ... JOIN, SHOW COLUMNS) is MySQL-family only.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ss_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      SS_DATABASE_CLASS: MySQLDatabase
      SS_DATABASE_SERVER: 127.0.0.1
      SS_DATABASE_PORT: 3306
      SS_DATABASE_USERNAME: root
      SS_DATABASE_PASSWORD: root
      SS_DATABASE_NAME: ss_ci
      SS_ENVIRONMENT_TYPE: dev

    steps:
      - name: Check out the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, mysqli, gd, zip, dom, xml, tokenizer, simplexml, ctype, hash, session
          tools: composer:v2
          coverage: none

      - name: Build a host project
        # The module cannot be tested on its own: it needs a booted Silverstripe app. It only needs
        # the framework, so the host requires recipe-core rather than recipe-cms.
        # The module is required through a PATH repository pointing at the checkout, and
        # symlinked rather than mirrored ON PURPOSE - `/tests` is `export-ignore` in
        # .gitattributes, so a dist or mirrored install contains no tests at all.
        run: |
          mkdir -p app-host
          cd app-host
          cat > composer.json <<JSON
          {
            "name": "restruct/ci-host",
            "require": {
              "silverstripe/recipe-core": "${{ matrix.recipe }}",
              "silverstripe/recipe-testing": "${{ matrix.testing }}",
              "restruct/silverstripe-database-migrations": "*"
            },
            "repositories": [
              { "type": "path", "url": "../module", "options": { "symlink": true } }
            ],
            "autoload-dev": {
              "psr-4": {
                "Restruct\\\\SilverStripe\\\\Migrations\\\\Tests\\\\": "vendor/restruct/silverstripe-database-migrations/tests/"
              }
            },
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": { "allow-plugins": true }
          }
          JSON
          # Silverstripe 5 is in security-fixes-only until its April 2027 EOL, and every release of
          # it is covered by advisory PKSA-pjvm-vnw2-n3m2 (range <6.2.1), which will not be patched
          # there. Composer therefore refuses to install it under the default policy.
          # Blocking is disabled HERE ONLY, in a throwaway CI host project.
          composer config policy.advisories.block false
          composer update --no-interaction --no-progress

      - name: Configure the test suite
        run: |
          cd app-host
          cat > phpunit.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- Warning-to-error escalation is the RUNNER's behaviour and differs by PHPUnit
               major: 9 (SS5) converts warnings by default, 11 (SS6) has no such attribute.
               failOnWarning is pinned so a warning behaves identically on every leg. -->
          <phpunit bootstrap="vendor/silverstripe/framework/tests/bootstrap.php" colors="true"
                   failOnWarning="true">
              <testsuites>
                  <testsuite name="database-migrations">
                      <directory>vendor/restruct/silverstripe-database-migrations/tests</directory>
                  </testsuite>
              </testsuites>
          </phpunit>
          XML

      - name: Run tests
        working-directory: app-host
        # Every run flushes the manifest, and how differs per major:
        # - SS5 (framework 5, PHPUnit 9): SS_PHPUNIT_FLUSH does not exist in framework 5, so it
        #   would be inert. The flush is a trailing `flush=1` argument, which only works AFTER an
        #   explicit test path - `--testsuite x flush=1` makes PHPUnit 9 open "flush=1" as a file
        #   and fail. So the SS5 legs run by path; phpunit.xml still supplies bootstrap and
        #   failOnWarning.
        # - SS6 (framework 6, PHPUnit 11): a `flush=1` argument no longer works; framework 6 reads
        #   SS_PHPUNIT_FLUSH instead, which also combines with --testsuite.
        # A green run is not enough on its own: a suite that silently discovers no tests (a broken
        # autoload-dev mapping, a mirrored install without /tests) still exits 0. So every leg
        # passes --fail-on-empty-test-suite (PHPUnit 9.6 and 11 both honour it; PHPUnit 9's
        # --help just does not list it).
        # (was: the step also grepped for an exact "OK (21 tests" line. Removed: PHPUnit prints
        # "OK, but there were issues!" / "OK, but incomplete, skipped, or risky tests!" with exit 0
        # when a deprecation or a skip occurs, so the guard failed green runs with a wrong
        # "different number of tests" diagnosis.)
        run: |
          # EXPECTED='OK (21 tests'
          set -o pipefail
          if [ "${{ matrix.silverstripe }}" = "5" ]; then
            vendor/bin/phpunit --fail-on-empty-test-suite vendor/restruct/silverstripe-database-migrations/tests flush=1 | tee phpunit.txt
          else
            SS_PHPUNIT_FLUSH=1 vendor/bin/phpunit --fail-on-empty-test-suite --testsuite database-migrations | tee phpunit.txt
          fi
          # if ! grep -qF "$EXPECTED" phpunit.txt; then
          #   echo "::error::expected '$EXPECTED', the suite ran a different number of tests"
          #   exit 1
          # fi

      - name: Consumer-shape database test
        # A module's own suite cannot catch an unbuildable fixture in its tests/ dir (e.g. an
        # abstract DataObject): that only fatals the temp-database build of a CONSUMING project.
        # So a plain $usesDatabase test runs from the host too, with the same per-major flush.
        working-directory: app-host
        run: |
          mkdir -p app/tests
          cat > app/tests/ConsumerDbTest.php <<'PHP'
          <?php

          use SilverStripe\Dev\SapphireTest;
          use SilverStripe\Security\Member;

          class ConsumerDbTest extends SapphireTest
          {
              protected $usesDatabase = true;

              public function testTempDatabaseBuilds()
              {
                  $m = Member::create(['FirstName' => 'x']);
                  $m->write();
                  $this->assertGreaterThan(0, $m->ID);
              }
          }
          PHP
          # --fail-on-empty-test-suite: a consumer test that is not discovered must not pass as green.
          if [ "${{ matrix.silverstripe }}" = "5" ]; then
            vendor/bin/phpunit --fail-on-empty-test-suite app/tests flush=1
          else
            SS_PHPUNIT_FLUSH=1 vendor/bin/phpunit --fail-on-empty-test-suite app/tests
          fi

      - name: Build the database through the real entry point
        # The suite fires the hooks directly; this proves a real dev/build boots with the module
        # applied. On SS6, config:audit lists YAML keyed to a class that does not exist - which is
        # exactly how the pre-6 DatabaseAdmin block went silently inert (it reported
        # "silverstripe\orm\databaseadmin::$extensions"). config:audit itself always exits 0, so the
        # step greps its output; other packages' findings are printed but not failed on.
        # config:audit prints only "class::$property", never the value, so a DatabaseAdmin
        # extensions finding cannot tell whose extension it is. The step therefore reads the
        # merged config (sake config:dump, YAML after a two-line heading) and fails only when
        # DatabaseAdmin's extensions name a Restruct\ class - a third-party package's own
        # DatabaseAdmin block is printed but is not this module's build to fail.
        # (was: fail on any line of the audit output containing "databaseadmin")
        # Scope: only DatabaseAdmin *extensions* naming a Restruct\ class fail this step. Any other
        # DatabaseAdmin finding (e.g. a consumer's classname_value_remapping or other keys still on
        # DatabaseAdmin) is printed in the audit output but does NOT fail it - this module's own
        # _config only ever sets `extensions` there, and consumer config is the consumer's to re-key.
        working-directory: app-host
        run: |
          set -o pipefail
          if [ "${{ matrix.silverstripe }}" = "5" ]; then
            php vendor/silverstripe/framework/cli-script.php dev/build flush=1
          else
            vendor/bin/sake db:build --flush
            vendor/bin/sake config:audit | tee audit.txt
            # if grep -qi 'databaseadmin' audit.txt; then
            if grep -qiF 'silverstripe\orm\databaseadmin::$extensions' audit.txt; then
              # config:dump prints a two-line heading before the YAML; if that ever changes the
              # parse below fails loudly instead of reading as "no extensions".
              vendor/bin/sake config:dump | tail -n +3 > config-dump.yml
              php -r '
                require "vendor/autoload.php";
                $config = Symfony\Component\Yaml\Yaml::parseFile($argv[1]);
                if (!is_array($config) || !isset($config["silverstripe\\orm\\databaseadmin"])) {
                    echo "::error::could not read DatabaseAdmin from sake config:dump output (format changed?)\n";
                    exit(1);
                }
                $extensions = $config["silverstripe\\orm\\databaseadmin"]["extensions"] ?? [];
                $ours = array_filter((array) $extensions, fn ($ext) => is_string($ext) && stripos(ltrim($ext, "\\"), "Restruct\\") === 0);
                if ($ours) {
                    echo "::error::DatabaseAdmin (gone on Silverstripe 6) is given extension(s) " . implode(", ", $ours) . "\n";
                    exit(1);
                }
                echo "DatabaseAdmin extensions config found, none of it Restruct\\: not failing\n";
              ' config-dump.yml
            fi
          fi

  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the module's declared php constraint.
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check every PHP file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
